        if (product.stock <= 0) return;
        const variant = getVariant(product);

        setCart((prev) => {
          const existingIndex = prev.findIndex((item) => item.product.id === product.id && item.variant === variant);
          if (existingIndex > -1) {
            const currentQty = prev[existingIndex].quantity;
            if (currentQty + 1 > product.stock) return prev;
            const updated = [...prev];
            updated[existingIndex].quantity += 1;
            return updated;
          }
          return [...prev, { product, variant, quantity: 1 }];
        });
        setIsCartOpen(true);
      };

      const updateCartQty = (idx, delta) => {
        setCart((prev) => {
          const updated = [...prev];
          const item = updated[idx];
          const nextQty = item.quantity + delta;
          if (nextQty <= 0) {
            updated.splice(idx, 1);
          } else if (nextQty <= item.product.stock) {
            item.quantity = nextQty;
          }
          return updated;
        });

              <div className="bg-[#0D2B1E] border-l border-[#D4AF37]/40 w-full max-w-md h-full flex flex-col justify-between p-6 overflow-y-auto">
                <div className="space-y-5">
                  <div className="flex items-center justify-between border-b border-white/10 pb-4">
                    <h3 className="text-2xl font-serif font-bold text-[#D4AF37]">Keranjang Pemesanan</h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-gray-400 hover:text-white text-sm font-bold">
                      ✕ Tutup
                    </button>
                  </div>

                  {cart.length === 0 ? (
                    <div className="py-12 text-center space-y-3">
                      <p className="text-sm text-gray-300">Keranjang Anda masih kosong.</p>
                      <button
                        onClick={() => setIsCartOpen(false)}
                        className="gold-gradient-bg text-[#081C14] font-bold text-xs px-5 py-2.5 rounded-full"
                      >
                        Lihat Katalog Promo
                      </button>
                    </div>
                  ) : (
                    <>
                      <div className="space-y-3">
                        {cart.map((item, idx) => (
                          <div
                            key={`${item.product.id}-${item.variant}`}
                            className="bg-[#081C14] border border-[#D4AF37]/25 p-3.5 rounded-2xl flex justify-between items-center gap-3"
                          >
                            <div className="text-xs space-y-1">
                              <p className="font-bold text-white">{item.product.shortName}</p>
                              <p className="text-[#F3E5AB]">{item.variant}</p>
                              <p className="text-[#D4AF37] font-bold">{formatRupiah(item.product.price * item.quantity)}</p>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => updateCartQty(idx, -1)} className="w-7 h-7 rounded-lg bg-[#163d2a] text-white font-bold">
                                -
                              </button>
                              <span className="text-xs font-bold w-5 text-center">{item.quantity}</span>
                              <button onClick={() => updateCartQty(idx, 1)} className="w-7 h-7 rounded-lg bg-[#D4AF37] text-[#081C14] font-bold">
                                +
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>

                      {totalSavings > 0 && (
                        <div className="bg-[#163D2A] border border-[#D4AF37]/40 rounded-xl px-3.5 py-2 text-xs text-[#F3E5AB] flex justify-between">
                          <span>🎉 Total Penghematan Promo:</span>
                          <span className="font-bold text-[#D4AF37]">{formatRupiah(totalSavings)}</span>
                        </div>
                      )}

                      <form onSubmit={handleCheckoutWhatsApp} className="space-y-3 pt-3 border-t border-white/10">
                        <p className="text-xs font-bold text-[#D4AF37] uppercase tracking-wider">Data Pengiriman & Checkout</p>
                        <input
                          type="text"
                          required
                          placeholder="Nama Lengkap Penerima"
                          value={customerName}
                          onChange={(e) => setCustomerName(e.target.value)}
                          className="w-full bg-[#081C14] border border-[#D4AF37]/40 rounded-xl px-3.5 py-2.5 text-xs text-white"
                        />
                        <input
                          type="tel"
                          required
                          placeholder="Nomor WhatsApp Aktif (Contoh: 0812xxxx)"
                          value={customerPhone}
                          onChange={(e) => setCustomerPhone(e.target.value)}
                          className="w-full bg-[#081C14] border border-[#D4AF37]/40 rounded-xl px-3.5 py-2.5 text-xs text-white"
                        />
                        <textarea
                          required
                          rows="2"
                          placeholder="Alamat Lengkap (Jalan, Kecamatan, Kota, Kode Pos)"
                          value={customerAddress}
                          onChange={(e) => setCustomerAddress(e.target.value)}
                          className="w-full bg-[#081C14] border border-[#D4AF37]/40 rounded-xl px-3.5 py-2.5 text-xs text-white"
                        />
                        <select
                          value={courier}
                          onChange={(e) => setCourier(e.target.value)}
                          className="w-full bg-[#081C14] border border-[#D4AF37]/40 rounded-xl px-3.5 py-2.5 text-xs text-white"
                        >
                          <option value="Paxel Instant / Same Day (Rekomendasi)">Paxel Instant / Same Day (Rekomendasi)</option>
                          <option value="JNE YES (Yakin Esok Sampai)">JNE YES (Yakin Esok Sampai)</option>
                          <option value="SiCepat BEST">SiCepat BEST</option>
                          <option value="J&T Express">J&T Express</option>
                          <option value="Ninja Xpress">Ninja Xpress</option>
                          <option value="Gosend / GrabExpress Instant">Gosend / GrabExpress Instant</option>
                        </select>
                        <input
                          type="text"
                          placeholder="Catatan Tambahan / Ucapan Kartu Hampers (Opsional)"
                          value={notes}
                          onChange={(e) => setNotes(e.target.value)}
                          className="w-full bg-[#081C14] border border-[#D4AF37]/40 rounded-xl px-3.5 py-2.5 text-xs text-white"
                        />

                        <div className="pt-2">
                          <div className="flex justify-between text-sm font-bold mb-3">
                            <span>Total Tagihan:</span>
                            <span className="text-[#D4AF37] text-lg">{formatRupiah(totalPrice)}</span>
                          </div>
                          <button
                            type="submit"
                            className="w-full gold-gradient-bg text-[#081C14] font-extrabold py-3.5 px-5 rounded-xl text-xs shadow-lg hover:brightness-110 transition"
                          >
                            💬 Kirim Pesanan & Invoice ke WhatsApp Official
                          </button>
                        </div>
                      </form>
                    </>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
